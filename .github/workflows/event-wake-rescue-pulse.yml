name: Event wake rescue pulse

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/event-wake-rescue-pulse.yml'
  schedule:
    # GitHub documents that scheduled workflows can be delayed/dropped under load,
    # especially near the start of an hour. Keep the 5-minute minimum cadence but offset it.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rruler-event-wake-rescue
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate durable rescue gate
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rruler/tools /tmp/rruler/state
          fetch() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$REPO/contents/$1?ref=main" -o "/tmp/rruler/$1"; }
          for p in state/CURRENT.json state/ACTIVITY.json state/EVENT_WAKE_LEDGER.json state/SUCCESSOR_STARTUP.json; do fetch "$p"; done
          fetch tools/evaluate_event_rescue.py
          result=$(python /tmp/rruler/tools/evaluate_event_rescue.py /tmp/rruler/state/CURRENT.json /tmp/rruler/state/ACTIVITY.json /tmp/rruler/state/EVENT_WAKE_LEDGER.json /tmp/rruler/state/SUCCESSOR_STARTUP.json --as-of "$(date -Iseconds)")
          emit=$(jq -r '.emit' <<<"$result")
          reason=$(jq -r '.event_reason // ""' <<<"$result")
          printf 'emit=%s\\nreason=%s\\n' "$emit" "$reason" >> "$GITHUB_OUTPUT"
          printf '%s\\n' "$result"
      - name: Emit one bounded PR-lane event
        if: steps.gate.outputs.emit == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch event-wake-lab "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p .rruler-event-lane
          printf '{"producer":"ACTIONS_RESCUE_PULSE","emitted_at":"%s","reason":"${{ steps.gate.outputs.reason }}"}\n' "$(date -u +%FT%TZ)" > .rruler-event-lane/rescue-pulse.json
          git add .rruler-event-lane/rescue-pulse.json
          git commit -m 'event-wake: guarded stale-owner rescue pulse'
          git push origin HEAD:event-wake-lab

name: Validate P0 scorecard

on:
  push:
    branches: ["main"]
    paths:
      - "state/P0_SCORECARD.json"
      - "state/PROGRAM_GOALS.json"
      - "control/run-continuation-gate.v1.json"
      - "control/rolling-rrule-lifecycle.v1.json"
      - ".github/workflows/validate-p0-scorecard.yml"
  pull_request:
    paths:
      - "state/P0_SCORECARD.json"
      - "state/PROGRAM_GOALS.json"
      - "control/run-continuation-gate.v1.json"
      - "control/rolling-rrule-lifecycle.v1.json"
      - ".github/workflows/validate-p0-scorecard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact commit and reject stale P0 timing projection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rruler/state /tmp/rruler/control
          fetch() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$REPO/contents/$1?ref=$SHA" -o "/tmp/rruler/$1"; }
          fetch state/P0_SCORECARD.json
          fetch state/PROGRAM_GOALS.json
          fetch control/run-continuation-gate.v1.json
          fetch control/rolling-rrule-lifecycle.v1.json
          cd /tmp/rruler
          python - <<'PY'
          import json
          from pathlib import Path

          score = json.loads(Path('state/P0_SCORECARD.json').read_text())
          goals = json.loads(Path('state/PROGRAM_GOALS.json').read_text())
          gate = json.loads(Path('control/run-continuation-gate.v1.json').read_text())
          lifecycle = json.loads(Path('control/rolling-rrule-lifecycle.v1.json').read_text())

          metrics = score.get('metrics', {})
          if metrics.get('minimum_continue_turn_seconds') != 600:
              raise SystemExit('P0 scorecard drift: normal CONTINUE floor must be 10 minutes (600 seconds)')
          if metrics.get('active_canary_final_rearm_offset_seconds') != 120:
              raise SystemExit('P0 scorecard drift: active canary close must be 2 minutes (120 seconds)')
          if metrics.get('historical_comparator_final_rearm_offset_seconds') != 60:
              raise SystemExit('P0 scorecard drift: historical comparator must remain 1 minute (60 seconds)')
          if '10 minutes (600 seconds)' not in metrics.get('normal_continue_minimum_human', ''):
              raise SystemExit('P0 scorecard lacks explicit 10-minute (600-second) human semantics')

          decision = gate.get('turn_decision', {})
          if decision.get('normal_continue_minimum_elapsed_seconds') != 600:
              raise SystemExit('continuation gate drift from 10 minutes (600 seconds)')
          timing = lifecycle.get('timing', {})
          if timing.get('final_rearm_offset_seconds') != 120:
              raise SystemExit('lifecycle drift from active 2-minute (120-second) final-rearm canary')

          goalmap = {g.get('goal_id'): g for g in goals.get('goals', [])}
          p0a = goalmap.get('GOAL-TURN-WORKTIME-P0A')
          p0b = goalmap.get('GOAL-SCHEDULE-REARM-P0B')
          if not p0a or p0a.get('acceptance', {}).get('normal_continue_minimum_elapsed_seconds') != 600:
              raise SystemExit('operator-locked P0-A 10-minute (600-second) goal missing/drifted')
          p0b_accept = (p0b or {}).get('acceptance', {})
          if p0b_accept.get('active_canary_final_rearm_offset_seconds') != 120:
              raise SystemExit('operator-locked P0-B active 2-minute (120-second) canary missing/drifted')
          if p0b_accept.get('historical_comparator_offset_seconds') != 60:
              raise SystemExit('operator-locked P0-B historical 1-minute (60-second) comparator missing/drifted')

          print('P0 timing projection aligned: 10 minutes (600 seconds) work floor; active 2 minutes (120 seconds) final-rearm canary; historical 1 minute (60 seconds) comparator preserved.')
          PY

name: Validate continuation policy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check continuation authority from GitHub contents
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fetch() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$REPO/contents/$1?ref=$SHA" -o "$2"; }
          fetch control/run-continuation-gate.v1.json /tmp/gate.json
          fetch control/relay-policy.v1.json /tmp/policy.json
          fetch state/CURRENT.json /tmp/current.json
          python - <<'PY'
          import json
          gate=json.load(open('/tmp/gate.json')); policy=json.load(open('/tmp/policy.json')); current=json.load(open('/tmp/current.json'))
          assert gate['status']=='ACTIVE'
          assert set(gate['program_nonterminal_states'])=={'CONTINUE','DEGRADED_CONTINUATION'}
          assert gate['default_for_nonterminal_owner']=='MUST_CONTINUE_USEFUL_WORK'
          assert gate['nonterminal_no_handoff_rule']['required_action']=='SELECT_AND_EXECUTE_NEXT_USEFUL_ADMISSIBLE_UNIT'
          assert set(gate['run_end_allowed_only_for'])=={'COMMITTED_SUCCESSOR_HANDOFF','EXPLICIT_OPERATOR_STOP','PLATFORM_ENFORCED_TERMINATION'}
          required={'PRIMARY_OBJECTIVE_COMPLETE','CI_PASS','ROOT_COMPLETE','WAITING_FOR_NEXT_WAKE','SCHEDULE_BOUNDARY'}
          assert required <= set(gate['never_end_because'])
          assert policy['utilization']['nonterminal_voluntary_turn_end_forbidden'] is True
          assert current['continuation']['run_continuation_gate_policy']=='control/run-continuation-gate.v1.json'
          if current['program_status'] in gate['program_nonterminal_states']:
              assert current['continuation']['program_terminal_disabled_required'] is True
          print('continuation authority validation passed')
          PY

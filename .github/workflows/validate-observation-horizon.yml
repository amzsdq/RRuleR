name: Validate observation horizon provenance

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rruler-observation-horizon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch validator inputs and verify durable provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fetch() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$REPO/contents/$1?ref=$2" -o "$3"; }
          mkdir -p /tmp/rruler/tools /tmp/rruler/tests /tmp/rruler/state /tmp/rruler/control
          fetch tools/validate_observation_horizon.py "$SHA" /tmp/rruler/tools/validate_observation_horizon.py
          fetch tests/test_observation_horizon_validator.py "$SHA" /tmp/rruler/tests/test_observation_horizon_validator.py
          fetch state/OBSERVATION_HORIZON.json "$SHA" /tmp/rruler/state/OBSERVATION_HORIZON.json
          fetch control/observation-horizon.v1.json "$SHA" /tmp/rruler/control/observation-horizon.v1.json
          PARENT_SHA=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/$SHA" | python -c 'import json,sys; d=json.load(sys.stdin); print(d["parents"][0]["sha"] if d.get("parents") else "")')
          if [ -n "$PARENT_SHA" ]; then
            fetch state/OBSERVATION_HORIZON.json "$PARENT_SHA" /tmp/rruler/state/PREVIOUS_OBSERVATION_HORIZON.json
          fi
          cd /tmp/rruler
          python -m unittest tests.test_observation_horizon_validator -v
          if [ -f state/PREVIOUS_OBSERVATION_HORIZON.json ]; then
            python tools/validate_observation_horizon.py state/OBSERVATION_HORIZON.json control/observation-horizon.v1.json state/PREVIOUS_OBSERVATION_HORIZON.json
          else
            python tools/validate_observation_horizon.py state/OBSERVATION_HORIZON.json control/observation-horizon.v1.json
          fi

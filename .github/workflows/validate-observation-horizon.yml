name: Validate observation horizon provenance

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run observation horizon regression tests
        run: python -m unittest tests.test_observation_horizon_validator -v
      - name: Verify durable provenance against GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python tools/validate_observation_horizon.py state/OBSERVATION_HORIZON.json control/observation-horizon.v1.json

name: Validate observation horizon provenance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rruler-observation-horizon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch validator inputs and verify durable provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fetch() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$REPO/contents/$1?ref=$2" -o "$3"; }
          mkdir -p /tmp/rruler/tools /tmp/rruler/tests /tmp/rruler/state /tmp/rruler/control
          fetch tools/validate_observation_horizon.py "$SHA" /tmp/rruler/tools/validate_observation_horizon.py
          fetch tests/test_observation_horizon_validator.py "$SHA" /tmp/rruler/tests/test_observation_horizon_validator.py
          fetch tests/test_observation_horizon_merge.py "$SHA" /tmp/rruler/tests/test_observation_horizon_merge.py
          fetch state/OBSERVATION_HORIZON.json "$SHA" /tmp/rruler/state/OBSERVATION_HORIZON.json
          fetch control/observation-horizon.v1.json "$SHA" /tmp/rruler/control/observation-horizon.v1.json
          mapfile -t PARENT_SHAS < <(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/$SHA" | python -c 'import json,sys; d=json.load(sys.stdin); [print(p["sha"]) for p in d.get("parents", [])]')
          PREVIOUS_FILES=()
          i=0
          for parent_sha in "${PARENT_SHAS[@]}"; do
            previous="/tmp/rruler/state/PREVIOUS_OBSERVATION_HORIZON_${i}.json"
            fetch state/OBSERVATION_HORIZON.json "$parent_sha" "$previous"
            PREVIOUS_FILES+=("state/PREVIOUS_OBSERVATION_HORIZON_${i}.json")
            i=$((i + 1))
          done
          cd /tmp/rruler
          python -m unittest tests.test_observation_horizon_validator tests.test_observation_horizon_merge -v
          python tools/validate_observation_horizon.py state/OBSERVATION_HORIZON.json control/observation-horizon.v1.json "${PREVIOUS_FILES[@]}"

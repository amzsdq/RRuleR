name: Validate RRuleR control plane

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rruler-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate durable control contracts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fetch() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$REPO/contents/$1?ref=$SHA" -o "$2"; }

          fetch state/CURRENT.json /tmp/current.json
          fetch state/ACTIVITY.json /tmp/activity.json
          fetch state/HANDOFF.json /tmp/handoff.json
          fetch state/TURN_PLAN.json /tmp/turn-plan.json
          fetch state/UTILIZATION.json /tmp/utilization.json
          fetch state/PROGRAM_GOALS.json /tmp/goals.json
          fetch state/NEXT_PACKET.json /tmp/next-packet.json
          fetch state/SAAS_PARITY.json /tmp/saas-parity.json
          fetch state/RUNS.jsonl /tmp/runs.jsonl

          fetch control/ACTIVE_CONTROLS.json /tmp/active-controls.json
          fetch control/relay-policy.v1.json /tmp/relay.json
          fetch control/scheduler-fence.v1.json /tmp/fence.json
          fetch control/rolling-rrule-lifecycle.v1.json /tmp/rolling.json
          fetch control/successor-baton.v1.json /tmp/baton.json
          fetch control/runtime-continuity.v1.json /tmp/runtime-continuity.json
          fetch control/runtime-mode.v1.json /tmp/runtime-mode.json
          fetch control/handoff-recovery.v1.json /tmp/recovery.json
          fetch control/run-continuation-gate.v1.json /tmp/continuation-gate.json
          fetch control/saas-parity-gates.v1.json /tmp/saas-gates.json

          python - <<'PY'
          import json

          def load(path):
              with open(path) as f:
                  return json.load(f)

          current=load('/tmp/current.json')
          activity=load('/tmp/activity.json')
          handoff=load('/tmp/handoff.json')
          plan=load('/tmp/turn-plan.json')
          util=load('/tmp/utilization.json')
          goals=load('/tmp/goals.json')
          packet=load('/tmp/next-packet.json')
          parity=load('/tmp/saas-parity.json')
          controls=load('/tmp/active-controls.json')
          relay=load('/tmp/relay.json')
          fence=load('/tmp/fence.json')
          rolling=load('/tmp/rolling.json')
          baton=load('/tmp/baton.json')
          runtime=load('/tmp/runtime-continuity.json')
          mode=load('/tmp/runtime-mode.json')
          recovery=load('/tmp/recovery.json')
          gate=load('/tmp/continuation-gate.json')
          saas=load('/tmp/saas-gates.json')

          allowed_status={'CONTINUE','PROGRAM_COMPLETE','BLOCKED_EXTERNAL','DEGRADED_CONTINUATION'}
          assert current['program_status'] in allowed_status

          goalmap={g['goal_id']:g for g in goals['goals']}
          assert 'GOAL-COMPETE-SAAS' in goalmap
          assert goalmap['GOAL-UTILIZATION-P0']['priority']=='P0'

          assert relay['status']=='ACTIVE'
          sched=relay['scheduler']
          assert sched['mechanism']=='RRULE_HOURLY_ROLLING_COMPLETION_RELATIVE'
          assert sched['fixed_quarter_cycle_active'] is False
          assert sched['lifecycle_policy']=='control/rolling-rrule-lifecycle.v1.json'
          assert sched['successor_baton_policy']=='control/successor-baton.v1.json'
          assert sched['successor_packet_path']=='state/NEXT_PACKET.json'
          assert sched['reservation_packet_cache_authoritative'] is False

          assert rolling['status']=='ACTIVE'
          assert rolling['timing']['target_useful_work_seconds']==600
          assert rolling['timing']['provisional_safety_margin_seconds']==180
          assert rolling['timing']['final_rearm_offset_seconds']==60
          assert rolling['timing']['fixed_quarter_cycle_required'] is False
          assert 'PROVISIONAL_ARM_AND_VERIFY' in rolling['startup_order']
          assert 'FINAL_REARM_AND_VERIFY' in rolling['startup_order']

          assert baton['status']=='ACTIVE'
          assert baton['canonical_spec']=='docs/ROLLING_RRULE_BATON_SPEC.md'
          assert baton['durable_packet_path']=='state/NEXT_PACKET.json'
          assert baton['reservation_capsule_authoritative'] is False
          assert baton['default_target_work_seconds']==600

          required_packet={
              'packet_id','program_id','root_job_id','planned_by_authority_epoch','checkpoint_ref',
              'objective','target_work_seconds','safety_margin_seconds','provisional_arm_offset_seconds',
              'final_rearm_offset_seconds','acceptance_criteria','first_action','fallback_action','status'
          }
          assert required_packet <= set(packet)
          assert packet['provisional_arm_offset_seconds']==packet['target_work_seconds']+packet['safety_margin_seconds']
          assert 420 <= packet['target_work_seconds'] <= 660
          assert 60 <= packet['safety_margin_seconds'] <= 240
          assert packet['final_rearm_offset_seconds']==60

          assert controls['status']=='ACTIVE'
          mandatory=set(controls['mandatory_on_wake'])
          for p in {
              'control/rolling-rrule-lifecycle.v1.json',
              'control/successor-baton.v1.json',
              'control/saas-parity-gates.v1.json',
              'state/NEXT_PACKET.json',
              'state/SAAS_PARITY.json'
          }:
              assert p in mandatory

          assert runtime['components']['wake_source']['current_adapter']=='RRULE_HOURLY_ROLLING_COMPLETION_RELATIVE'
          assert runtime['successor_baton']['packet_path']=='state/NEXT_PACKET.json'
          assert mode['scheduler_role']=='FAST_NORMAL_CONTINUATION_PLUS_COLD_RESCUE_WAKE'
          assert 'LOAD_OR_REFRESH_SUCCESSOR_PACKET_FROM_EXACT_DURABLE_NEXT_ACTION' in recovery['recovery_sequence']

          assert gate['status']=='ACTIVE'
          assert gate['default_for_nonterminal_owner']=='MUST_CONTINUE_USEFUL_WORK'
          assert gate['pre_final_authorization']['required'] is True

          assert saas['status']=='ACTIVE'
          assert saas['canonical_spec']=='docs/SAAS_PARITY_ARCHITECTURE.md'
          assert saas['structural_parity_excludes_model_quality'] is True
          assert parity['policy']=='control/saas-parity-gates.v1.json'
          assert parity['model_quality_scored_separately'] is True

          assert util['target']['turn_window_seconds']==900
          assert util['target']['observed_useful_span_seconds']==840
          assert util['measurement']['maximum_unexplained_gap_seconds_for_acceptance']==120

          if activity.get('status')=='WORKING':
              assert activity.get('authority_epoch')==current.get('authority_epoch')
              assert activity.get('active_run_id')==current.get('current_owner')
              assert plan.get('status')=='ACTIVE'
              assert plan.get('run_id')==activity.get('active_run_id')
              assert plan.get('authority_epoch')==activity.get('authority_epoch')

          allowed_end={'PROGRAM_COMPLETE','BLOCKED_EXTERNAL','COMMITTED_SUCCESSOR_HANDOFF','EXPLICIT_OPERATOR_STOP','PLATFORM_ENFORCED_TERMINATION'}
          seen=set()
          with open('/tmp/runs.jsonl') as f:
              for n,line in enumerate(f,1):
                  if not line.strip():
                      continue
                  o=json.loads(line)
                  oid=o.get('observation_id')
                  assert oid and oid not in seen, f'duplicate/invalid observation at {n}'
                  seen.add(oid)
                  if o.get('run_ended_at') is not None:
                      assert o.get('end_reason') in allowed_end

          print(f"control-plane validation passed: owner={current.get('current_owner')} epoch={current.get('authority_epoch')} packet={packet.get('packet_id')}")
          PY

      - name: Reject active quarter-cycle regressions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for p in AGENTS.md control/POLICY.md control/relay-policy.v1.json control/runtime-continuity.v1.json control/runtime-mode.v1.json control/handoff-recovery.v1.json; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$REPO/contents/$p?ref=$SHA" >> /tmp/active-policy.txt
            printf "\n" >> /tmp/active-policy.txt
          done
          if grep -E 'RRULE_HOURLY_QUARTER_SELF_SHIFT|PLAN_15_MIN_WORK_PACKET_FROM_EXACT_DURABLE_NEXT_ACTION|REARM_SAME_CANONICAL_FOR_NEXT_15M' /tmp/active-policy.txt; then
            echo "stale quarter-cycle active instruction detected"
            exit 1
          fi

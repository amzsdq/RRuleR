name: Validate RRuleR control plane

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate durable state from GitHub contents
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fetch() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$REPO/contents/$1?ref=$SHA" -o "$2"; }
          fetch state/CURRENT.json /tmp/current.json
          fetch state/HANDOFF.json /tmp/handoff.json
          fetch state/ACTIVITY.json /tmp/activity.json
          fetch state/RUNS.jsonl /tmp/runs.jsonl
          fetch control/relay-policy.v1.json /tmp/policy.json
          fetch control/liveness-policy.v1.json /tmp/live.json
          fetch control/handoff-recovery.v1.json /tmp/recovery.json
          fetch control/scheduler-fence.v1.json /tmp/scheduler-fence.json
          python - <<'PY'
          import json
          current=json.load(open('/tmp/current.json')); policy=json.load(open('/tmp/policy.json')); live=json.load(open('/tmp/live.json')); activity=json.load(open('/tmp/activity.json')); handoff=json.load(open('/tmp/handoff.json')); recovery=json.load(open('/tmp/recovery.json')); fence=json.load(open('/tmp/scheduler-fence.json'))
          if current['program_status'] not in {'CONTINUE','PROGRAM_COMPLETE','BLOCKED_EXTERNAL','DEGRADED_CONTINUATION'}: raise SystemExit('invalid program_status')
          if activity.get('authority_epoch') != current.get('authority_epoch'): raise SystemExit('activity authority_epoch mismatch')
          if activity.get('status')=='WORKING' and activity.get('active_run_id') != current.get('current_owner'): raise SystemExit('WORKING owner mismatch')
          if policy.get('utilization',{}).get('nonterminal_voluntary_turn_end_forbidden') is not True: raise SystemExit('no-self-termination invariant missing')
          expected={'PROGRAM_COMPLETE','BLOCKED_EXTERNAL','COMMITTED_SUCCESSOR_HANDOFF','EXPLICIT_OPERATOR_STOP','PLATFORM_ENFORCED_TERMINATION'}
          if set(policy.get('terminal',{}).get('voluntary_turn_end_allowed_only_for',[])) != expected: raise SystemExit('turn-end allowlist mismatch')
          if live.get('status')!='ACTIVE': raise SystemExit('liveness policy inactive')
          if recovery.get('status')!='ACTIVE': raise SystemExit('handoff recovery policy inactive')
          if fence.get('status')!='ACTIVE': raise SystemExit('scheduler fence inactive')
          required_start=['READ_FRESH_CURRENT_BEFORE_AUTOMATION_MUTATION','COMPARE_ACTUAL_WAKE_TO_EXPECTED_DUE','IF_STALE_WAKE_DO_NOT_MUTATE_AUTOMATION_OR_AUTHORITY','IF_EXPECTED_WAKE_REARM_AND_VERIFY','THEN_CONTINUE_HANDOFF_PROTOCOL']
          if fence.get('startup_order') != required_start: raise SystemExit('scheduler fence startup order mismatch')
          if fence.get('queued_old_occurrence_must_not_disable_canonical') is not True or fence.get('queued_old_occurrence_must_not_restore_old_prompt_or_title') is not True: raise SystemExit('stale queued wake mutation fence missing')
          if current.get('continuation',{}).get('scheduler_fence_policy')!='control/scheduler-fence.v1.json': raise SystemExit('CURRENT does not bind scheduler fence')
          required_recovery=['RE_READ_CURRENT_ACTIVITY_HANDOFF','VERIFY_PREDECESSOR_STILL_SUSPECT_OR_OVERDUE_AND_UNCHANGED','ADVANCE_AUTHORITY_EPOCH_TO_SUCCESSOR','MARK_SUCCESSOR_WORKING','MARK_HANDOFF_RECOVERED_TAKEOVER','DO_NOT_REPLAY_PREDECESSOR_ACTIVE_UNIT_BLINDLY','PLAN_15_MIN_WORK_PACKET_FROM_EXACT_DURABLE_NEXT_ACTION','CONTINUE_WORK']
          if recovery.get('recovery_sequence') != required_recovery: raise SystemExit('handoff recovery sequence mismatch')
          stale=recovery.get('stale_path',{})
          if stale.get('eligible_when_predecessor_freshness')!='SUSPECT_OR_OVERDUE' or stale.get('handoff_ack_grace_seconds')!=120 or stale.get('requires_no_new_predecessor_progress_during_grace') is not True: raise SystemExit('stale handoff grace contract invalid')
          if recovery.get('successor_may_not_take_over_while_predecessor_is_fresh') is not True: raise SystemExit('fresh predecessor takeover must be forbidden')
          if handoff.get('program_id') != current.get('program_id') or handoff.get('root_job_id') != current.get('root_job_id'): raise SystemExit('handoff identity mismatch')
          if handoff.get('handoff_state')=='RECOVERED_TAKEOVER':
              if handoff.get('successor_run_id') != current.get('current_owner'): raise SystemExit('recovered successor must own CURRENT')
              if not handoff.get('recovery_taken_at') or not handoff.get('recovery_reason'): raise SystemExit('recovered takeover lacks evidence')
          seq=policy.get('handoff',{}).get('successor_start_sequence',[])
          required_seq=['REARM_SAME_CANONICAL_FOR_NEXT_15M','VERIFY_REARM','IF_PREDECESSOR_ACTIVE_PERSIST_HANDOFF_REQUEST','WAIT_FOR_DURABLE_HANDOFF_COMMIT','CLAIM_NEXT_AUTHORITY_EPOCH','PLAN_15_MIN_WORK_PACKET','EXECUTE_WORK_PACKET']
          if seq != required_seq: raise SystemExit('successor sequence mismatch')
          cycle=policy.get('worker_cycle',{})
          if cycle.get('planned_work_horizon_minutes') != 15 or cycle.get('work_packet_is_stop_timer') is not False: raise SystemExit('15m work-packet contract invalid')
          if policy.get('handoff',{}).get('successor_rearm_before_handoff_request_required') is not True: raise SystemExit('successor rearm must precede handoff request')
          if handoff.get('protocol') != 'SUCCESSOR_REARM_THEN_REQUEST': raise SystemExit('handoff protocol mismatch')
          seen=set()
          for n,line in enumerate(open('/tmp/runs.jsonl'),1):
              if not line.strip(): continue
              o=json.loads(line); oid=o.get('observation_id')
              if not oid or oid in seen: raise SystemExit(f'invalid duplicate run observation {n}')
              seen.add(oid); ended=o.get('run_ended_at') is not None; reason=o.get('end_reason')
              if ended and reason is None: raise SystemExit(f'ended run {oid} lacks end_reason')
              if reason is not None and reason not in expected: raise SystemExit(f'unauthorized end_reason {reason} in {oid}')
              if ended and reason=='COMMITTED_SUCCESSOR_HANDOFF' and not o.get('successor_observed_at'): raise SystemExit(f'handoff end without successor observation in {oid}')
              if ended and reason=='PROGRAM_COMPLETE' and o.get('program_status_at_end')!='PROGRAM_COMPLETE': raise SystemExit(f'false complete end in {oid}')
              if ended and reason=='BLOCKED_EXTERNAL' and o.get('program_status_at_end')!='BLOCKED_EXTERNAL': raise SystemExit(f'false blocked end in {oid}')
          print(f'RRuleR validation passed; runs={len(seen)} owner={current.get("current_owner")} epoch={current.get("authority_epoch")}')
          PY

name: Validate RRuleR control plane

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rruler-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and validate current durable state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fetch() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$REPO/contents/$1?ref=$2" -o "$3"; }
          mkdir -p /tmp/rruler/tools /tmp/rruler/tests /tmp/rruler/state /tmp/rruler/control /tmp/rruler/schemas
          for p in state/CURRENT.json state/ACTIVITY.json state/HANDOFF.json state/TURN_PLAN.json state/UTILIZATION.json state/PROGRAM_GOALS.json state/WORK_EVIDENCE.json state/RUNS.jsonl state/OBSERVATION_HORIZON.json state/PREDICTIVE_PREARM_CANARY.json state/SUCCESSOR_STARTUP.json control/ACTIVE_CONTROLS.json control/relay-policy.v1.json control/scheduler-fence.v1.json control/rolling-rrule-lifecycle.v1.json control/handoff-recovery.v1.json control/run-continuation-gate.v1.json control/rolling-window-promotion.v1.json control/observation-horizon.v1.json schemas/run-observation.schema.json; do fetch "$p" "$SHA" "/tmp/rruler/$p"; done
          fetch tools/validate_work_evidence.py "$SHA" /tmp/rruler/tools/validate_work_evidence.py
          fetch tools/append_work_evidence.py "$SHA" /tmp/rruler/tools/append_work_evidence.py
          fetch tools/validate_run_records.py "$SHA" /tmp/rruler/tools/validate_run_records.py
          fetch tests/test_run_records.py "$SHA" /tmp/rruler/tests/test_run_records.py
          fetch tools/summarize_work_evidence.py "$SHA" /tmp/rruler/tools/summarize_work_evidence.py
          fetch tools/validate_observation_horizon.py "$SHA" /tmp/rruler/tools/validate_observation_horizon.py
          fetch tests/test_work_evidence_validator.py "$SHA" /tmp/rruler/tests/test_work_evidence_validator.py
          fetch tests/test_append_work_evidence.py "$SHA" /tmp/rruler/tests/test_append_work_evidence.py
          fetch tests/test_summarize_work_evidence.py "$SHA" /tmp/rruler/tests/test_summarize_work_evidence.py
          fetch tools/summarize_turn_close.py "$SHA" /tmp/rruler/tools/summarize_turn_close.py
          fetch tests/test_summarize_turn_close.py "$SHA" /tmp/rruler/tests/test_summarize_turn_close.py
          fetch tools/audit_startup_boundaries.py "$SHA" /tmp/rruler/tools/audit_startup_boundaries.py
          fetch tests/test_audit_startup_boundaries.py "$SHA" /tmp/rruler/tests/test_audit_startup_boundaries.py
          fetch tools/compute_completion_due.py "$SHA" /tmp/rruler/tools/compute_completion_due.py
          fetch tests/test_compute_completion_due.py "$SHA" /tmp/rruler/tests/test_compute_completion_due.py
          fetch tools/build_turn_review.py "$SHA" /tmp/rruler/tools/build_turn_review.py
          fetch tests/test_build_turn_review.py "$SHA" /tmp/rruler/tests/test_build_turn_review.py
          fetch tools/audit_successor_progress.py "$SHA" /tmp/rruler/tools/audit_successor_progress.py
          fetch tests/test_audit_successor_progress.py "$SHA" /tmp/rruler/tests/test_audit_successor_progress.py
          mapfile -t PARENT_SHAS < <(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/$SHA" | python -c 'import json,sys; d=json.load(sys.stdin); [print(p["sha"]) for p in d.get("parents", [])]')
          PREVIOUS_FILES=()
          i=0
          for parent_sha in "${PARENT_SHAS[@]}"; do
            previous="/tmp/rruler/state/PREVIOUS_OBSERVATION_HORIZON_${i}.json"
            fetch state/OBSERVATION_HORIZON.json "$parent_sha" "$previous"
            PREVIOUS_FILES+=("state/PREVIOUS_OBSERVATION_HORIZON_${i}.json")
            i=$((i + 1))
          done
          cd /tmp/rruler
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          def load(path): return json.loads(Path(path).read_text())
          current=load('state/CURRENT.json'); activity=load('state/ACTIVITY.json'); turn=load('state/TURN_PLAN.json'); util=load('state/UTILIZATION.json'); goals=load('state/PROGRAM_GOALS.json'); controls=load('control/ACTIVE_CONTROLS.json'); policy=load('control/relay-policy.v1.json'); fence=load('control/scheduler-fence.v1.json'); lifecycle=load('control/rolling-rrule-lifecycle.v1.json'); recovery=load('control/handoff-recovery.v1.json'); gate=load('control/run-continuation-gate.v1.json'); promotion=load('control/rolling-window-promotion.v1.json'); evidence=load('state/WORK_EVIDENCE.json'); horizon=load('state/OBSERVATION_HORIZON.json'); horizon_policy=load('control/observation-horizon.v1.json'); prearm=load('state/PREDICTIVE_PREARM_CANARY.json')
          if controls.get('status')!='ACTIVE': raise SystemExit('active control registry inactive')
          if current.get('continuation',{}).get('active_control_registry')!='control/ACTIVE_CONTROLS.json': raise SystemExit('active control registry pointer drift')
          required={'control/run-continuation-gate.v1.json','control/scheduler-fence.v1.json','control/handoff-recovery.v1.json','state/CURRENT.json','state/ACTIVITY.json','state/HANDOFF.json','state/TURN_PLAN.json','state/UTILIZATION.json','state/PREDICTIVE_PREARM_CANARY.json','state/SUCCESSOR_STARTUP.json'}
          if not required <= set(controls.get('mandatory_on_wake',[])): raise SystemExit('mandatory registry baseline incomplete')
          if 'NONTERMINAL_PROGRAM_MUST_RETAIN_VERIFIED_CONTINUATION' not in controls.get('hard_invariants',[]): raise SystemExit('continuation invariant missing')
          if 'PREDICTIVE_PREARM_MUST_NOT_CREATE_DUAL_SUBSTANTIVE_AUTHORITY' not in controls.get('hard_invariants',[]): raise SystemExit('predictive prearm authority invariant missing')
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; sha=os.environ['SHA']
          for path in controls.get('mandatory_on_wake',[]):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?ref={sha}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as r:
                  if r.status != 200: raise SystemExit(f'missing mandatory control: {path}')
          nonterminal={'CONTINUE','DEGRADED_CONTINUATION'}; terminal={'PROGRAM_COMPLETE','BLOCKED_EXTERNAL'}
          if current['program_status'] not in nonterminal|terminal: raise SystemExit('invalid program_status')
          if activity.get('authority_epoch') != current.get('authority_epoch'): raise SystemExit('activity authority_epoch mismatch')
          if activity.get('status')=='WORKING':
              if activity.get('active_run_id') != current.get('current_owner'): raise SystemExit('WORKING owner mismatch')
              if turn.get('status')!='ACTIVE' or turn.get('run_id')!=activity.get('active_run_id') or turn.get('authority_epoch')!=activity.get('authority_epoch'): raise SystemExit('turn plan owner/epoch mismatch')
              if not (2 <= len(turn.get('checkpointable_substeps',[])) <= 5): raise SystemExit('turn plan substep count invalid')
              if not (600 <= turn.get('expected_useful_seconds',0) <= 840): raise SystemExit('turn plan duration invalid')
          sched=policy.get('scheduler',{})
          allowed_sched={'RRULE_HOURLY_ROLLING_COMPLETION_RELATIVE','RRULE_HOURLY_ROLLING_COMPLETION_RELATIVE_WITH_GUARDED_PREDICTIVE_PREARM_CANARY'}
          if sched.get('mechanism') not in allowed_sched or sched.get('canonical_reuse_required') is not True or sched.get('replacement_automation_forbidden') is not True: raise SystemExit('rolling scheduler invariant invalid')
          if lifecycle.get('status')!='ACTIVE' or lifecycle.get('timing',{}).get('final_rearm_offset_seconds')!=60 or lifecycle.get('timing',{}).get('exact_second_final_rearm_required') is not True: raise SystemExit('rolling lifecycle invalid')
          pc=lifecycle.get('predictive_prearm_canary',{})
          if pc.get('experiment_id')!='UTIL-EXP-018' or (pc.get('status')!='ROLLED_BACK_AFTER_FAILED_FIRST_CANARY' and pc.get('keep_provisional_cold_rescue_unchanged') is not True): raise SystemExit('predictive prearm lifecycle invariant invalid')
          if recovery.get('status')!='ACTIVE' or recovery.get('recovery_classes',{}).get('PREDICTIVE_PREARM_OVERLAP',{}).get('substantive_takeover_while_predecessor_fresh') is not False: raise SystemExit('predictive overlap fence invalid')
          startup_ack=recovery.get('recovery_classes',{}).get('STARTUP_ACK_MISSING',{})
          if startup_ack.get('recovery_requires_independent_wake_source') is not True or startup_ack.get('substantive_authority_granted_by_detection') is not False: raise SystemExit('startup acknowledgement recovery invariant invalid')
          required_startup={'SUCCESSOR_OBSERVED_AT','BOOT_STARTED_AT','REARM_VERIFIED_AT','AUTHORITY_CLAIM_AT','FIRST_DURABLE_USEFUL_AT'}
          if not required_startup <= set(lifecycle.get('successor_start_measurement',{}).get('required_observed_boundaries',[])): raise SystemExit('startup boundary measurement invariant invalid')
          if prearm.get('experiment_id')!='UTIL-EXP-018' or lifecycle.get('timing',{}).get('provisional_due_offset_seconds')!=780 or prearm.get('cold_rescue_offset_seconds',780)!=780 or prearm.get('promotion_rule',{}).get('requires_no_duplicate_substantive_side_effect') is not True: raise SystemExit('predictive canary state invalid')
          if fence.get('status')!='ACTIVE' or fence.get('stale_wake_action')!='RECOVER_FORWARD_NO_ROLLBACK': raise SystemExit('scheduler fence invalid')
          if gate.get('status')!='ACTIVE' or gate.get('default_for_nonterminal_owner')!='MUST_CONTINUE_USEFUL_WORK' or gate.get('nonterminal_no_handoff_rule',{}).get('run_end')!='FORBIDDEN' or gate.get('final_response_is_authoritative_side_effect') is not True or gate.get('enforcement',{}).get('future_wake_exists_does_not_authorize_current_owner_to_end') is not True: raise SystemExit('continuation gate invalid')
          goalmap={g.get('goal_id'):g for g in goals.get('goals',[])}; p0=goalmap.get('GOAL-UTILIZATION-P0')
          if not p0 or p0.get('priority')!='P0' or p0.get('acceptance',{}).get('rolling_mean_useful_seconds_gte')!=840: raise SystemExit('P0 goal drift')
          if (promotion.get('window_seconds'),promotion.get('required_useful_seconds'),promotion.get('max_unexplained_internal_gap_seconds'),promotion.get('minimum_valid_windows_for_pass')) != (900,840,120,3): raise SystemExit('promotion threshold drift')
          if util.get('goal_reached') and len(util.get('valid_completed_windows_rolling',[])) < 3: raise SystemExit('false utilization PASS')
          if evidence.get('rules',{}).get('forward_only') is not True or evidence.get('collection',{}).get('historical_backfill') is not False: raise SystemExit('work evidence invariant broken')
          if horizon_policy.get('status')!='ACTIVE' or horizon.get('counts_as_useful_work') is not False or horizon.get('monotonic_forward_only') is not True: raise SystemExit('observation horizon invariant broken')
          print(f"control-plane structural validation passed owner={current.get('current_owner')} epoch={current.get('authority_epoch')}")
          PY
          PYTHONPATH=tools python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/validate_work_evidence.py state/WORK_EVIDENCE.json
          python tools/validate_run_records.py state/RUNS.jsonl
          python tools/summarize_turn_close.py state/RUNS.jsonl state/SUCCESSOR_STARTUP.json >/tmp/turn-close-summary.json
          python tools/audit_startup_boundaries.py state/SUCCESSOR_STARTUP.json state/RUNS.jsonl >/tmp/startup-audit.json
          python tools/build_turn_review.py state/RUNS.jsonl state/WORK_EVIDENCE.json state/SUCCESSOR_STARTUP.json >/tmp/turn-review.json
          python tools/audit_successor_progress.py state/SUCCESSOR_STARTUP.json --as-of "$(date -Iseconds)" --threshold-seconds 120 >/tmp/successor-progress-audit.json
          python tools/compute_completion_due.py 2026-09-21T18:51:46+09:00 60 >/tmp/completion-due.json
          CURRENT_EPOCH=$(python -c 'import json; print(json.load(open("state/CURRENT.json"))["authority_epoch"])')
          python tools/summarize_work_evidence.py state/WORK_EVIDENCE.json "$CURRENT_EPOCH" state/RUNS.jsonl >/tmp/run-summary.json
          python tools/validate_observation_horizon.py state/OBSERVATION_HORIZON.json control/observation-horizon.v1.json "${PREVIOUS_FILES[@]}"

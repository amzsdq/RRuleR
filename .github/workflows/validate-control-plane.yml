name: Validate RRuleR control plane

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rruler-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate durable control-plane invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())

          current=load('state/CURRENT.json')
          activity=load('state/ACTIVITY.json')
          handoff=load('state/HANDOFF.json')
          turn=load('state/TURN_PLAN.json')
          util=load('state/UTILIZATION.json')
          goals=load('state/PROGRAM_GOALS.json')
          policy=load('control/relay-policy.v1.json')
          fence=load('control/scheduler-fence.v1.json')
          lifecycle=load('control/rolling-rrule-lifecycle.v1.json')
          recovery=load('control/handoff-recovery.v1.json')
          gate=load('control/run-continuation-gate.v1.json')
          promotion=load('control/rolling-window-promotion.v1.json')

          nonterminal={'CONTINUE','DEGRADED_CONTINUATION'}
          terminal={'PROGRAM_COMPLETE','BLOCKED_EXTERNAL'}
          if current['program_status'] not in nonterminal|terminal:
              raise SystemExit('invalid program_status')
          if activity.get('authority_epoch') != current.get('authority_epoch'):
              raise SystemExit('activity authority_epoch mismatch')
          if activity.get('status') == 'WORKING' and activity.get('active_run_id') != current.get('current_owner'):
              raise SystemExit('WORKING owner mismatch')
          if activity.get('status') == 'WORKING':
              if turn.get('status') != 'ACTIVE': raise SystemExit('WORKING owner lacks ACTIVE plan')
              if turn.get('run_id') != activity.get('active_run_id') or turn.get('authority_epoch') != activity.get('authority_epoch'):
                  raise SystemExit('turn plan owner/epoch mismatch')
              if not (2 <= len(turn.get('checkpointable_substeps',[])) <= 5): raise SystemExit('turn plan substep count invalid')
              if not (600 <= turn.get('expected_useful_seconds',0) <= 840): raise SystemExit('turn plan duration invalid')

          sched=policy.get('scheduler',{})
          if sched.get('mechanism') != 'RRULE_HOURLY_ROLLING_COMPLETION_RELATIVE': raise SystemExit('rolling scheduler inactive')
          if sched.get('canonical_reuse_required') is not True or sched.get('replacement_automation_forbidden') is not True: raise SystemExit('canonical invariant missing')
          if lifecycle.get('status') != 'ACTIVE' or lifecycle.get('timing',{}).get('final_rearm_offset_seconds') != 60: raise SystemExit('rolling lifecycle invalid')
          if fence.get('status') != 'ACTIVE' or fence.get('stale_wake_action') != 'RECOVER_FORWARD_NO_ROLLBACK': raise SystemExit('scheduler fence invalid')
          if recovery.get('status') != 'ACTIVE': raise SystemExit('recovery policy inactive')
          if gate.get('status') != 'ACTIVE' or gate.get('final_response_is_authoritative_side_effect') is not True: raise SystemExit('continuation gate inactive')
          if gate.get('enforcement',{}).get('future_wake_exists_does_not_authorize_current_owner_to_end') is not True: raise SystemExit('future wake incorrectly authorizes end')
          if current.get('program_status') in nonterminal and current.get('continuation',{}).get('mechanism') != 'RRULE_HOURLY_ROLLING_COMPLETION_RELATIVE': raise SystemExit('nonterminal CURRENT lost rolling continuation')

          goalmap={g.get('goal_id'):g for g in goals.get('goals',[])}
          p0=goalmap.get('GOAL-UTILIZATION-P0')
          if not p0 or p0.get('priority') != 'P0': raise SystemExit('P0 goal missing')
          if p0.get('acceptance',{}).get('rolling_mean_useful_seconds_gte') != 840: raise SystemExit('P0 target drift')
          if promotion.get('window_seconds') != 900 or promotion.get('required_useful_seconds') != 840 or promotion.get('max_unexplained_internal_gap_seconds') != 120: raise SystemExit('promotion thresholds drift')
          if promotion.get('minimum_valid_windows_for_pass') != 3: raise SystemExit('promotion count drift')
          if util.get('goal_reached') and len(util.get('valid_completed_turns_rolling',[])) < 3: raise SystemExit('false utilization PASS')

          evidence=load('state/WORK_EVIDENCE.json')
          if evidence.get('rules',{}).get('forward_only') is not True or evidence.get('collection',{}).get('historical_backfill') is not False:
              raise SystemExit('work evidence forward-only invariant broken')
          print(f"control-plane validation passed owner={current.get('current_owner')} epoch={current.get('authority_epoch')}")
          PY
      - name: Run repository unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit current work-evidence ledger shape
        run: python tools/validate_work_evidence.py state/WORK_EVIDENCE.json

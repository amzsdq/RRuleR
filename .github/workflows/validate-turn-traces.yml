name: Validate durable turn traces

on:
  push:
    branches: ["main"]
    paths:
      - "state/TURN_TRACES.json"
      - "schemas/turn-traces.schema.json"
      - "tools/validate_turn_traces.py"
      - "tools/append_turn_trace.py"
      - "tools/render_turn_trace_flush.py"
      - "tests/test_validate_turn_traces.py"
      - "tests/test_append_turn_trace.py"
      - "tests/test_render_turn_trace_flush.py"
      - ".github/workflows/validate-turn-traces.yml"
  pull_request:
    paths:
      - "state/TURN_TRACES.json"
      - "schemas/turn-traces.schema.json"
      - "tools/validate_turn_traces.py"
      - "tools/append_turn_trace.py"
      - "tools/render_turn_trace_flush.py"
      - "tests/test_validate_turn_traces.py"
      - "tests/test_append_turn_trace.py"
      - "tests/test_render_turn_trace_flush.py"
      - ".github/workflows/validate-turn-traces.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current trace ledger
        run: python tools/validate_turn_traces.py state/TURN_TRACES.json
      - name: Run focused trace tests
        run: python -m unittest tests.test_validate_turn_traces tests.test_append_turn_trace tests.test_render_turn_trace_flush -v

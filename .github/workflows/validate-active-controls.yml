name: Validate active controls

on:
  push:
    branches: ["main"]
    paths:
      - 'control/ACTIVE_CONTROLS.json'
      - 'state/CURRENT.json'
      - 'control/run-continuation-gate.v1.json'
      - '.github/workflows/validate-active-controls.yml'
  pull_request:
    paths:
      - 'control/ACTIVE_CONTROLS.json'
      - 'state/CURRENT.json'
      - 'control/run-continuation-gate.v1.json'
      - '.github/workflows/validate-active-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check mandatory control registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fetch() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/$REPO/contents/$1?ref=$SHA" -o "$2"; }
          fetch control/ACTIVE_CONTROLS.json /tmp/controls.json
          fetch state/CURRENT.json /tmp/current.json
          python - <<'PY'
          import json, os, urllib.request
          controls=json.load(open('/tmp/controls.json')); current=json.load(open('/tmp/current.json'))
          assert controls['status']=='ACTIVE'
          assert current['continuation']['active_control_registry']=='control/ACTIVE_CONTROLS.json'
          required={'control/run-continuation-gate.v1.json','control/scheduler-fence.v1.json','control/handoff-recovery.v1.json','state/CURRENT.json','state/ACTIVITY.json','state/HANDOFF.json','state/TURN_PLAN.json','state/UTILIZATION.json'}
          assert required <= set(controls['mandatory_on_wake'])
          assert 'NONTERMINAL_OWNER_MUST_CONTINUE_USEFUL_WORK_UNTIL_AUTHORITY_TRANSFER' in controls['hard_invariants']
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; sha=os.environ['SHA']
          for path in controls['mandatory_on_wake']:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}?ref={sha}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as r:
                  if r.status != 200: raise SystemExit(f'missing mandatory control: {path}')
          print('active control registry validation passed')
          PY
